name: artisan_app
description: "Kalakriti — voice-first marketplace for artisans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.3
  cached_network_image: ^3.4.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^8.1.2
  timezone: ^0.10.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  provider: ^6.1.2
  uuid: ^4.5.1
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  table_calendar: ^3.1.3
  geolocator: ^13.0.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F6EEDE"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#F6EEDE"
  image: assets/icon.png
  android: true
  ios: false
  android_12:
    color: "#F6EEDE"
    image: assets/icon.png
  fullscreen: true